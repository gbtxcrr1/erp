{% extends "base.html" %}

{% block title %}
Novo Lançamento
{% endblock %}

{% block content %}
<h2>Novo Lançamento Financeiro</h2>

<form method="POST" class="form">
    <label>Tipo</label>
    <select name="type" required>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
    </select>

    <label>Descrição</label>
    <input name="description" placeholder="ex: Venda, Salário, Aluguel..." required>

    <label>Categoria</label>
    <input name="category" placeholder="ex: Operacional, Pessoal...">

    <label>Valor (R$)</label>
    <input type="number" step="0.01" name="amount" placeholder="0.00" required>

    <div class="form-actions">
        <button class="btn" type="submit">Salvar</button>
        <a class="btn btn-secondary" href="/finance">Cancelar</a>
    </div>
</form>

{% endblock %}
