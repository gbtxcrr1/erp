{% extends "base.html" %}

{% block title %}
Clientes
{% endblock %}

{% block content %}

<h2>Clientes</h2>

<div class="top-bar">
    <a class="btn" href="/clients/new">Novo Cliente</a>
</div>

<table>
    <thead>
        <th>ID</th>
        <th>NOME</th>
        <th>EMAIL</th>
    </thead>

    <tbody>
        {% for client in clients %}
        <tr>
            <td>{{ client.id }}</td>
            <td>{{ client.name }}</td>
            <td>{{ client.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
