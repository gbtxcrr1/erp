{% extends "base.html" %}

{% block title %}
{{ 'Editar Produto' if product else 'Novo Produto' }}
{% endblock %}

{% block content %}
<h2>{{ 'Editar Produto' if product else 'Novo Produto' }}</h2>

<form method="POST" class="form">
    <label>Nome</label>
    <input name="name" placeholder="nome" value="{{ product.name if product else '' }}" required>

    <label>Descrição</label>
    <input name="description" placeholder="descrição" value="{{ product.description if product else '' }}">

    <label>Preço</label>
    <input type="number" step="0.01" name="price" placeholder="0.00" value="{{ product.price if product else '' }}" required>

    <label>Categoria</label>
    <input name="category" placeholder="categoria" value="{{ product.category if product else '' }}">

    <label>SKU</label>
    <input name="sku" placeholder="código" value="{{ product.sku if product else '' }}">

    <div class="form-actions">
        <button class="btn" type="submit">Salvar</button>
        <a class="btn btn-secondary" href="/products">Cancelar</a>
    </div>
</form>

{% endblock %}
